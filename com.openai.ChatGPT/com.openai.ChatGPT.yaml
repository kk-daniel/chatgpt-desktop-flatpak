app-id: com.openai.ChatGPT
# Codex runs developer tools and SDK extensions inside the sandbox, so use the
# SDK as the runtime rather than limiting the app to the Platform surface.
runtime: org.freedesktop.Sdk
runtime-version: "25.08"
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: "25.08"
command: chatgpt
tags: [proprietary]
separate-locales: false
sdk-extensions:
  - org.freedesktop.Sdk.Extension.node24
add-extensions:
  com.visualstudio.code.tool:
    directory: tools
    subdirectories: true
    version: '25.08'
    add-ld-path: lib
    no-autodownload: true
    autodelete: false
  org.freedesktop.Sdk.Extension.node24:
    directory: lib/sdk/node24
    version: '25.08'
    add-ld-path: lib
    no-autodownload: false
    autodelete: false
build-options:
  append-path: /usr/lib/sdk/node24/bin
finish-args:
  - --require-version=0.10.3
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=dri
  - --env=XCURSOR_PATH=/run/host/user-share/icons:/run/host/share/icons
  - --env=ELECTRON_OZONE_PLATFORM_HINT=wayland
  # Sandbox-private ~/.codex for config.toml, skills, plugins and the session
  # databases. It is not shared with a host-installed Codex CLI.
  - --persist=.codex
  # Deliberately absent: --talk-name=org.freedesktop.secrets. Secret Service
  # has no per-application isolation; README documents the optional override.
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=com.canonical.AppMenu.Registrar
  - --talk-name=com.canonical.AppMenu.Registrar.*
  - --talk-name=com.canonical.indicator.application
  - --own-name=com.canonical.indicator.application.*
cleanup:
  - /include
  - /lib/pkgconfig
  - /share/gtk-doc
  - '*.la'
modules:
  # apply_extra needs to unwrap the RPM and its xz-compressed CPIO payload at
  # install time. The extractor consumes the CPIO as a stream, so no full-size
  # intermediate copy is written.
  - name: 7zip
    buildsystem: simple
    build-commands:
      - install -Dm755 7zz /app/bin/7zz
      - ln -s 7zz /app/bin/7z
    sources:
      - type: archive
        only-arches: [x86_64]
        url: https://github.com/ip7z/7zip/releases/download/26.02/7z2602-linux-x64.tar.xz
        sha256: 41aaba7b1235304ab5aa0624530c67ae829496cd29e875925271efdccc28c03e
        strip-components: 0
      - type: archive
        only-arches: [aarch64]
        url: https://github.com/ip7z/7zip/releases/download/26.02/7z2602-linux-arm64.tar.xz
        sha256: 70ea6cc737ae1495ea2d7eb20ef3120fe579bd3f1a83a9d2362b62ec5bde2bba
        strip-components: 0

  # The broker executes this copy inside the Flatpak's mount namespace. It is
  # pinned independently of the writable upstream payload so the app cannot
  # replace the binary the privileged side of the broker runs.
  - name: bubblewrap
    buildsystem: meson
    config-opts:
      - -Dbwrapdir=/app/libexec/flatpak-bwrap-broker
      - -Dman=disabled
      - -Dtests=false
      - -Dbash_completion=disabled
      - -Dzsh_completion=disabled
    sources:
      - type: archive
        url: https://github.com/containers/bubblewrap/releases/download/v0.12.0/bubblewrap-0.12.0.tar.xz
        sha256: 9760d007363e3abba7c747489910f9f82d9fca53ba3bd3282e396fa3c97a3314

  - name: chatgpt
    buildsystem: simple
    build-commands:
      - install -Dm755 chatgpt.sh /app/bin/chatgpt
      - install -Dm755 apply_extra /app/bin/apply_extra
      - install -Dm755 extract-chatgpt-rpm.py /app/bin/extract-chatgpt-rpm.py
      # Codex finds this as `bwrap` before its own bundled copy. The host broker
      # runs the real bubblewrap above inside this sandbox's namespaces.
      - install -Dm755 bwrap-client.py /app/bin/bwrap
      - install -Dm644 ${FLATPAK_ID}.metainfo.xml -t /app/share/metainfo
      - install -Dm644 ${FLATPAK_ID}.desktop -t /app/share/applications
      - install -Dm644 ${FLATPAK_ID}-url-handler.desktop -t /app/share/applications
      - install -Dm644 ${FLATPAK_ID}.png /app/share/icons/hicolor/256x256/apps/${FLATPAK_ID}.png
      - mkdir -p /app/extra/chatgpt
      - mkdir -p /app/lib/sdk/node24
      - mkdir -p /app/tools
      - ln -s /app/lib/sdk/node24/bin/node /app/bin/node
      - ln -s /app/lib/sdk/node24/bin/npm /app/bin/npm
      - ln -s /app/lib/sdk/node24/bin/npx /app/bin/npx
      - ln -s /app/lib/sdk/node24/bin/corepack /app/bin/corepack
    sources:
      # Official native Linux builds from OpenAI's signed RPM-MD repository.
      # The URLs are immutable; update-rpm-metadata.py verifies repomd.xml.asc,
      # follows its hash chain, and refreshes these checksums and sizes.
      - type: extra-data
        filename: chatgpt-x86_64.rpm
        only-arches: [x86_64]
        url: https://persistent.oaistatic.com/codex-app-prod/linux/rpm/x86_64/chatgpt-26.825.51511-1.x86_64.rpm
        sha256: 44e19ee796d788bffd741acb86a87be2f295d74fc4847132e7482bf04972c58d
        size: 458831841
      - type: extra-data
        filename: chatgpt-aarch64.rpm
        only-arches: [aarch64]
        url: https://persistent.oaistatic.com/codex-app-prod/linux/rpm/aarch64/chatgpt-26.825.51511-1.aarch64.rpm
        sha256: 45f225f9cd6b3b6bbfda8c3555fcdc03d9cae0421c2323a9b7f2db61bbb7c4f9
        size: 433897053
      - type: file
        path: apply_extra
      - type: file
        path: extract-chatgpt-rpm.py
      - type: file
        path: chatgpt.sh
      - type: file
        path: bwrap-client.py
      - type: file
        path: com.openai.ChatGPT.metainfo.xml
      - type: file
        path: com.openai.ChatGPT.desktop
      - type: file
        path: com.openai.ChatGPT-url-handler.desktop
      - type: file
        path: com.openai.ChatGPT.png
